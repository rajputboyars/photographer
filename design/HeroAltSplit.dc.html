<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap">
  <style>
    body { margin: 0; background: #F7F3ED; color: #14100E; font-family: "Jost", "Avenir Next", "Segoe UI", sans-serif; font-weight: 300; }
    a { color: oklch(0.55 0.09 70); } a:hover { color: oklch(0.42 0.08 70); }
    h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 300; margin: 0; letter-spacing: -0.015em; }
    p { margin: 0; text-wrap: pretty; }
  </style>
</helmet>

<div style="width: 1440px; height: 880px; background: #F7F3ED; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 26px 56px; border-bottom: 1px solid #E3DACE;">
    <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 24px; letter-spacing: 0.06em;">Isha Photography</div>
    <div style="display: flex; align-items: center; gap: 34px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #4A423B;">
      <span>Portfolio</span><span>Services</span><span>About</span>
      <span style="background: #14100E; color: #FFFDF9; padding: 13px 22px;">Check your date</span>
    </div>
  </div>

  <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr));">
    <div style="grid-column: span 6; display: flex; flex-direction: column; justify-content: center; gap: 30px; padding: 0 56px;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <span style="width: 40px; height: 1px; background: oklch(0.62 0.09 70); display: block;"></span>
        <span style="font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; color: oklch(0.55 0.09 70);">Est. [YEAR] &middot; [YOUR CITY]</span>
      </div>
      <h1 style="font-size: 76px; line-height: 0.96;">Weddings,<br>told the slow<br><em style="font-style: italic; color: oklch(0.55 0.09 70);">way</em></h1>
      <p style="font-size: 17px; line-height: 1.8; color: #4A423B; max-width: 440px;">Two people at your celebration, one with a camera and one with a cine lens, staying out of the way for as long as it takes.</p>
      <div style="display: flex; align-items: center; gap: 18px; padding-top: 4px;">
        <span style="background: #14100E; color: #FFFDF9; padding: 17px 30px; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;">Check your date</span>
        <span style="font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; border-bottom: 1px solid #14100E; padding-bottom: 6px;">See the portfolio</span>
      </div>
      <div style="display: flex; gap: 12px; padding-top: 22px;">
        <div style="width: 92px; height: 92px; overflow: hidden;"><img src="g1.jpg" alt="Wedding" style="width: 100%; height: 100%; object-fit: cover;"></div>
        <div style="width: 92px; height: 92px; overflow: hidden;"><img src="g5.jpg" alt="Pre-wedding" style="width: 100%; height: 100%; object-fit: cover;"></div>
        <div style="width: 92px; height: 92px; overflow: hidden;"><img src="g9.jpg" alt="Reception" style="width: 100%; height: 100%; object-fit: cover;"></div>
        <div style="width: 92px; height: 92px; border: 1px solid #DCD2C4; display: flex; align-items: center; justify-content: center; font-size: 12px; letter-spacing: 0.14em; color: #4A423B;">+[N]</div>
      </div>
    </div>
    <div style="grid-column: span 6; overflow: hidden;">
      <img src="hero-d.jpg" alt="Couple at their wedding" style="width: 100%; height: 100%; object-fit: cover;">
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
